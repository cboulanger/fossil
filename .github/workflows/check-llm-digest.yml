name: Check LLM guidelines

on:
  push:
    paths:
      - docs/guidelines.md
      - docs/guidelines-llm.md
      - scripts/check-llm-digest.py
  pull_request:
    paths:
      - docs/guidelines.md
      - docs/guidelines-llm.md
      - scripts/check-llm-digest.py

jobs:
  check-llm-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that docs/guidelines.md and docs/guidelines-llm.md are in sync
        run: python3 scripts/check-llm-digest.py
